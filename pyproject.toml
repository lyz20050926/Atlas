[project]
name = "nexmind-atlas"
version = "0.1.0"
description = "An evidence-grounded, adaptive reading mentor"
requires-python = ">=3.11"
dependencies = [
  "streamlit==1.62.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "python-dotenv==1.2.3",
  "httpx==0.28.1",
  "langgraph==1.2.11",
  "boto3==1.43.83",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
